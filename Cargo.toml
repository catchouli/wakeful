[package]
name = "wakeful"
version = "0.1.0"
edition = "2024"
description = "An RPG about identity and finding yourself"
publish = false

[dependencies]
bevy = "0.19"
# Compiles the OpenGL backend in (bevy omits it by default): keeps the game
# runnable where other graphics drivers are missing, and lets the `snapshot`
# dev tool render headless on software GL.
bevy_render = { version = "0.19", default-features = false, features = ["gles"] }
bevy_common_assets = { version = "0.17", features = ["ron"] }
# In-game scene editor UI.
bevy_egui = "0.42"
# Actor scripts: embedded, sandboxed scripting (no file/network access by
# default); wired to the game by hand since bevy_mod_scripting doesn't
# support Bevy 0.19 yet. `sync` makes ASTs/Scopes Send+Sync so they can
# live in components.
rhai = { version = "1.21", features = ["sync"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
